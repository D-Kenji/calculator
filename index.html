<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Rekenmachine</title>
    <link rel="stylesheet" href="style.css">
    <script src="script.js" defer></script>
</head>
<body>
    <div class="rekenmachine">
        <div class="display">
            <h2 class="displayTekst"></h2>
        </div>
        <div class="buttons">
            <div class="allClear"><button class="clear">AC</button></div>
            <div class="empty"></div>
            <div class="empty"></div>
            <div class="empty"></div>
            <div class="nummer"><button class="zeven">7</button></div>
            <div class="nummer"><button class="acht">8</button></div>
            <div class="nummer"><button class="negen">9</button></div>
            <div class="berekening"><button class="delen">÷</button></div>
            <div class="nummer"><button class="vier">4</button></div>
            <div class="nummer"><button class="vijf">5</button></div>
            <div class="nummer"><button class="zes">6</button></div>
            <div class="berekening"><button class="min">-</button></div>
            <div class="nummer"><button class="een">1</button></div>
            <div class="nummer"><button class="twee">2</button></div>
            <div class="nummer"><button class="drie">3</button></div>
            <div class="berekening"><button class="plus">+</button></div>
            <div class="nummer"><button class="nul">0</button></div>
            <div class="nummer"><button class="komma">.</button></div>
            <div class="berekening"><button class="gelijk">=</button></div>
            <div class="berekening"><button class="maal">x</button></div>
        </div>
    </div>
    <div class="history">
            <button class="historyButton">History</button>
        <div class="logs">
            
        </div>
    </div>
    
</body>
</html>
